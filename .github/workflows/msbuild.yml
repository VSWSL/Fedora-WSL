name: MSBuild

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

env:
  # Path to the solution file relative to the root of the project.
  SOLUTION_FILE_PATH: .
  APPX_CERTIFICATE_PASSWORD: ${{ secrets.APPX_CERTIFICATE_PASSWORD }}

permissions:
  contents: read

jobs:
  build:
    runs-on: blacksmith-4vcpu-windows-2025
    strategy:
      matrix:
        platform: [arm64, x64]
        target: [debug, release]

    steps:
      - uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v1

      - name: Install missing Visual Studio components
        shell: pwsh
        run: |
          # The Blacksmith Windows runner ships VS Build Tools 2022 with only
          # the basic C++ x86/x64 toolset. The launcher Win32 project on x64
          # builds out of the box, but FedoraWSL-Appx (UWP) needs the
          # Universal build tools workload, and the ARM64 jobs additionally
          # need the ARM64 C++ tools.
          $vsInstaller = "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vs_installer.exe"
          $installPath = "C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools"
          if (-not (Test-Path $vsInstaller)) {
            Write-Error "vs_installer.exe not found at $vsInstaller"
            exit 1
          }
          if (-not (Test-Path $installPath)) {
            Write-Error "Visual Studio BuildTools not found at $installPath"
            exit 1
          }
          # Build the argument list as an array; pass it to Start-Process via
          # array splatting so PowerShell quotes paths with spaces correctly.
          $vsArgs = @(
            'modify',
            '--installPath', $installPath,
            '--add', 'Microsoft.VisualStudio.Workload.UniversalBuildTools',
            '--includeRecommended',
            '--quiet', '--norestart', '--nocache'
          )
          if ('${{ matrix.platform }}' -eq 'arm64') {
            $vsArgs += @('--add', 'Microsoft.VisualStudio.Component.VC.Tools.ARM64')
          }
          Write-Host "Running: vs_installer.exe $($vsArgs -join ' ')"
          # Launch the installer; vs_installer forks the actual setup engine,
          # so wait on it explicitly instead of relying on --wait, which is
          # unreliable when invoked via Start-Process.
          $proc = Start-Process -FilePath $vsInstaller -ArgumentList $vsArgs -PassThru
          # Wait for vs_installer to exit, then for any setup engine children
          # (setup.exe / Microsoft.VisualStudio.Setup.Engine) that it spawned.
          $proc.WaitForExit()
          $deadline = (Get-Date).AddMinutes(30)
          while ((Get-Date) -lt $deadline) {
            $children = Get-Process -ErrorAction SilentlyContinue |
              Where-Object { $_.ProcessName -in @('setup', 'vs_installer', 'vs_installershell', 'VSIXInstaller') }
            if (-not $children) { break }
            Start-Sleep -Seconds 5
          }
          $exitCode = $proc.ExitCode
          Write-Host "vs_installer parent exited with code $exitCode"
          # 0: success. 3010: success but reboot requested. 862968804: success, no changes needed.
          if ($exitCode -ne 0 -and $exitCode -ne 3010 -and $exitCode -ne 862968804) {
            Write-Error "Visual Studio installer failed with exit code $exitCode"
            exit 1
          }

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Convert x64 to amd64
        id: convert_x64
        run: |
          if ("${{ matrix.platform }}" -eq "x64") {
              "platform=amd64" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else {
              "platform=${{ matrix.platform }}" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }

      - uses: suisei-cn/actions-download-file@v1.4.0
        id: downloadfile # Remember to give an ID if you need the output filename
        name: Download rootfs
        with:
          url: https://github.com/VSWSL/Fedora-WSL-RootFS/releases/latest/download/rootfs.${{ steps.convert_x64.outputs.platform }}.tar.gz
          target: ${{ matrix.platform }}
          filename: rootfs.tar.gz

      - name: Write file from base64 string
        id: write_file
        uses: timheuer/base64-to-file@v1
        with:
          fileName: "FedoraWSL-Appx-Test.pfx"
          encodedString: ${{ secrets.APPX_TEST_CERTIFICATE }}

      - name: Import certificate
        working-directory: ${{ github.workspace }}
        run: Import-PfxCertificate -FilePath ${{ steps.write_file.outputs.filePath }} -CertStoreLocation Cert:\CurrentUser\My -Password (ConvertTo-SecureString -String $env:APPX_CERTIFICATE_PASSWORD -Force -AsPlainText)

      - name: Restore NuGet packages
        working-directory: ${{ github.workspace }}
        run: nuget restore ${{ env.SOLUTION_FILE_PATH }}

      - name: Build solution
        working-directory: ${{ github.workspace }}
        run: python build.py --target=build --config=${{ matrix.target }} --platform=${{ matrix.platform }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FedoraWSL-Appx-${{ matrix.platform }}-${{ matrix.target }}
          path: AppPackages/FedoraWSL-Appx/FedoraWSL-Appx_*/FedoraWSL-Appx_*.*
